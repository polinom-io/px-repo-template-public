name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    # The template repo never releases: repos created from it start at 0.1.0.
    if: ${{ !github.event.repository.is_template }}
    permissions:
      contents: read
    uses: polinom-io/px-workflows-public/.github/workflows/release-please.yml@e3c491fee02c21fbe23300bc8d3f69f1cd0fa4c1 # v0.5.1
    with:
      app-client-id: ${{ vars.PX_RELEASE_PLEASE_APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.PX_RELEASE_PLEASE_APP_PRIVATE_KEY }}
