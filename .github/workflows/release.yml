name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    permissions:
      contents: read
    uses: polinom-io/px-workflows-public/.github/workflows/release-please.yml@b40a04acb5f2282b124f9aecbf5b596cee8cfc56 # v0.1.0
    with:
      app-client-id: ${{ vars.PX_RELEASE_PLEASE_APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.PX_RELEASE_PLEASE_APP_PRIVATE_KEY }}
