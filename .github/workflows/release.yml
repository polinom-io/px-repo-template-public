name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    permissions:
      contents: read
    uses: polinom-io/px-workflows-public/.github/workflows/release-please.yml@2e306475fe0169aa85e7f23057401ad4718e26f5 # v0.4.0
    with:
      app-client-id: ${{ vars.PX_RELEASE_PLEASE_APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.PX_RELEASE_PLEASE_APP_PRIVATE_KEY }}
