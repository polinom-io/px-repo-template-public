name: pr-standard

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-standard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-standard:
    permissions:
      contents: read
    uses: polinom-io/px-workflows-public/.github/workflows/pr-standard.yml@e3c491fee02c21fbe23300bc8d3f69f1cd0fa4c1 # v0.5.1
